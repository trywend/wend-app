name: ci

# Type-check gate. Per the repo policy, type errors block; lint is advisory.
# Runs on every push/PR to the integration branches.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: lint (advisory)
        run: npx expo lint || true
